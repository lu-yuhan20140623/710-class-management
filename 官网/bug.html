<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fbfaf7">
<title>Bug 反馈 · 课程表</title>
<meta name="description" content="提交课程表桌面端、网页版或手机端的问题反馈。">
<link rel="icon" type="image/png" href="assets/app.png">
<style>
  :root{
    --bg:#fbfaf7;--paper:#ffffff;--ink:#141a26;--ink-2:#4b5567;--dim:#818a9c;
    --line:#e6e3dc;--blue:#2563eb;--blue-deep:#1d4ed8;--blue-soft:#eef3ff;
    --green:#0f9d58;--green-soft:#eaf7ef;--red:#d04545;--red-soft:#fdecec;
    --shadow:0 12px 30px -12px rgba(20,26,38,.18),0 2px 8px rgba(20,26,38,.04);
    --radius:18px;--max:820px;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Microsoft YaHei UI","PingFang SC","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(900px 520px at 82% -8%,rgba(37,99,235,.10),transparent 65%);
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
  .nav{position:sticky;top:0;z-index:10;background:rgba(251,250,247,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .nav-inner{display:flex;align-items:center;gap:20px;height:64px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700}
  .brand img{width:30px;height:30px;border-radius:8px}
  .brand small{display:block;font-size:9px;letter-spacing:.14em;color:var(--dim);font-weight:600}
  .nav-links{margin-left:auto;display:flex;gap:22px;font-size:14.5px;color:var(--ink-2)}
  .nav-links a:hover,.nav-links a.active{color:var(--ink)}
  main{padding:56px 0 72px}
  h1{font-size:30px;margin:0 0 10px;letter-spacing:-.02em}
  .lead{color:var(--ink-2);margin:0 0 30px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
  .field{margin-bottom:20px}
  label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
  .hint{font-size:12.5px;color:var(--dim);font-weight:400;margin-left:6px}
  input,textarea{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
    background:#fff;color:var(--ink);font:inherit;font-size:15px;outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  textarea{min-height:150px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .actions{display:flex;align-items:center;gap:14px;margin-top:26px}
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:11px 24px;border-radius:999px;
    background:var(--blue);color:#fff;font-weight:600;font-size:15px;
    box-shadow:0 8px 20px -8px rgba(37,99,235,.6);transition:background .15s,transform .15s;
  }
  .btn:hover{background:var(--blue-deep)}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.6;cursor:not-allowed}
  .msg{font-size:14px;display:none}
  .msg.show{display:block}
  .msg.error{color:var(--red)}
  .success{display:none}
  .success.show{display:block}
  .success h2{margin:0 0 10px;font-size:21px;color:var(--green)}
  .success p{color:var(--ink-2);margin:6px 0}
  .bug-id{
    display:inline-block;margin-top:10px;padding:7px 12px;border-radius:8px;
    background:var(--blue-soft);color:var(--blue-deep);font-family:Consolas,monospace;font-size:14px;
  }
  .tips{margin-top:22px;padding:16px 18px;background:var(--green-soft);border-radius:12px;font-size:13.5px;color:#26663f}
  .tips b{color:#1c5433}
  .opts{display:flex;flex-wrap:wrap;gap:10px}
  .opt{
    display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line);
    border-radius:999px;font-size:14px;font-weight:400;margin:0;cursor:pointer;background:#fff;
    transition:border-color .15s,background .15s;
  }
  .opt:hover{border-color:#c9d3e4}
  .opt input{width:auto;margin:0;accent-color:var(--blue)}
  .opt:has(input:checked){border-color:var(--blue);background:var(--blue-soft);color:var(--blue-deep);font-weight:600}
  .versions{max-height:150px;overflow:auto;padding:2px}
  .history{margin-top:44px}
  .history-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  .history-head h2{margin:0;font-size:20px}
  .bug-item{
    background:var(--paper);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;margin-bottom:12px;
  }
  .bug-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600;font-size:15.5px}
  .badge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
  .badge.fixed{background:var(--green-soft);color:var(--green)}
  .badge.planned{background:#fff4e0;color:#a86400}
  .badge.wontfix{background:#f1f0ed;color:var(--dim)}
  .bug-meta{font-size:12.5px;color:var(--dim);margin-top:6px}
  .bug-desc{font-size:14px;color:var(--ink-2);margin:8px 0 0;white-space:pre-wrap;word-break:break-word}
  .empty{padding:22px;text-align:center;color:var(--dim);font-size:14px;background:var(--paper);border:1px dashed var(--line);border-radius:14px}
  footer{border-top:1px solid var(--line);padding:24px 0;color:var(--dim);font-size:13px}
  footer .wrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between}
  @media(max-width:640px){
    .nav-links{display:none}
    .row{grid-template-columns:1fr}
    main{padding:36px 0 56px}
    h1{font-size:24px}
    .card{padding:20px}
  }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html" aria-label="课程表首页">
      <img src="assets/app.png" alt="课程表图标">
      <span>课程表<small>CLASS SCHEDULE</small></span>
    </a>
    <nav class="nav-links" aria-label="导航">
      <a href="index.html#features">功能</a>
      <a href="index.html#download">下载</a>
      <a href="app/">网页版</a>
      <a href="bug.html" class="active">Bug 反馈</a>
      <a href="README.html">使用手册</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>Bug 反馈</h1>
    <p class="lead">遇到问题请尽量描述清楚：在哪个端、做了什么操作、期望结果和实际结果。修复完成后会从待处理列表移除，并出现在下方历史反馈中。</p>

    <div class="card" id="formCard">
      <form id="bugForm" novalidate>
        <div class="field">
          <label for="title">标题 <span class="hint">选填，一句话概括</span></label>
          <input id="title" name="title" maxlength="80" placeholder="例如：悬浮球菜单点击空白处不消失">
        </div>
        <div class="field">
          <label for="description">问题描述 <span class="hint">必填，5–2000 字</span></label>
          <textarea id="description" name="description" maxlength="2000" required
            placeholder="1. 我使用的是哪个端（电脑端 / 网页版 / 手机端）&#10;2. 具体操作步骤&#10;3. 期望看到什么，实际发生了什么&#10;4. 如果能复现，出现频率如何"></textarea>
        </div>
        <div class="field">
          <label>软件端 <span class="hint">必选，可多选</span></label>
          <div class="opts" id="sideOpts">
            <label class="opt"><input type="checkbox" name="side" value="电脑端">电脑端</label>
            <label class="opt"><input type="checkbox" name="side" value="网页版">网页版</label>
            <label class="opt"><input type="checkbox" name="side" value="手机端">手机端</label>
          </div>
        </div>
        <div class="field">
          <label>出现过的版本 <span class="hint">必选，可多选</span></label>
          <div class="opts versions" id="versionOpts"></div>
        </div>
        <div class="field">
          <label for="contact">联系方式 <span class="hint">选填，仅管理员可见</span></label>
          <input id="contact" name="contact" maxlength="100" placeholder="QQ / 微信 / 邮箱">
        </div>
        <div class="actions">
          <button class="btn" type="submit" id="submitBtn">提交反馈</button>
          <span class="msg" id="msg" role="status"></span>
        </div>
      </form>
    </div>

    <div class="card success" id="successCard">
      <h2>已收到，谢谢反馈</h2>
      <p>修复完成后这条记录会自动删除，不需要你再操作。</p>
      <p>反馈编号：<span class="bug-id" id="bugId"></span></p>
      <div class="actions">
        <button class="btn" type="button" id="againBtn">再提交一条</button>
      </div>
    </div>

    <div class="tips">
      <b>小提示：</b>如果问题与本地数据有关，请先不要卸载或清空数据；需要时可以在反馈里留下联系方式，方便进一步确认。
    </div>

    <section class="history" id="historySection">
      <div class="history-head">
        <h2>历史反馈</h2>
        <span class="hint" id="historyCount"></span>
      </div>
      <div id="historyList"><div class="empty">加载中…</div></div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 课程表 · 七年级10班</span>
    <span><a href="index.html">返回首页</a></span>
  </div>
</footer>

<script>
(function(){
  "use strict";
  var form = document.getElementById("bugForm");
  var formCard = document.getElementById("formCard");
  var successCard = document.getElementById("successCard");
  var msg = document.getElementById("msg");
  var btn = document.getElementById("submitBtn");
  var bugId = document.getElementById("bugId");

  var params = new URLSearchParams(location.search);

  // 版本列表由 /site-config 动态读取（改 update/latest.json 即可），这里保留静态兜底
  var VERSIONS = ["2.2.4", "2.2.3", "2.2.2", "2.2.0", "2.1.1", "2.1.0", "2.0.1", "2.0.0",
    "1.8.2", "1.8.1", "1.8.0", "1.7.0", "1.6.0", "1.5.0", "1.2.0", "更早"];
  var versionOpts = document.getElementById("versionOpts");

  function renderVersions(list){
    versionOpts.innerHTML = "";
    (list && list.length ? list : VERSIONS).forEach(function(v){
      var label = document.createElement("label");
      label.className = "opt";
      var input = document.createElement("input");
      input.type = "checkbox";
      input.name = "versions";
      input.value = v;
      if (params.get("v") === v) input.checked = true;
      label.appendChild(input);
      label.appendChild(document.createTextNode(v));
      versionOpts.appendChild(label);
    });
  }
  renderVersions(VERSIONS);

  fetch("/site-config", { cache: "no-store" }).then(function(res){
    return res.ok ? res.json() : null;
  }).then(function(cfg){
    var list = cfg && cfg.site && cfg.site.versions;
    if (list && list.length && list.join(",") !== VERSIONS.join(",")) renderVersions(list);
  }).catch(function(){});

  function checkedValues(name){
    return Array.prototype.slice.call(document.querySelectorAll('input[name="' + name + '"]:checked'))
      .map(function(el){ return el.value; });
  }

  function esc(text){
    return String(text == null ? "" : text)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function showError(text){
    msg.textContent = text;
    msg.className = "msg show error";
  }

  function clearError(){
    msg.textContent = "";
    msg.className = "msg";
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    clearError();

    var description = document.getElementById("description").value.trim();
    if (description.length < 5){
      showError("问题描述至少写 5 个字");
      document.getElementById("description").focus();
      return;
    }

    var side = checkedValues("side");
    if (!side.length){
      showError("请选择软件端");
      return;
    }

    var versions = checkedValues("versions");
    if (!versions.length){
      showError("请选择至少一个出现过的版本");
      return;
    }

    btn.disabled = true;
    btn.textContent = "提交中…";

    fetch("/api/bugs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        title: document.getElementById("title").value,
        description: description,
        contact: document.getElementById("contact").value,
        side: side,
        versions: versions,
        page: location.pathname
      })
    }).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(data){
        if (!res.ok || !data.ok){
          if (data.error) throw new Error(data.error);
          throw new Error(res.status === 404 ? "反馈通道暂未开放，请稍后再试" : "提交失败，请稍后再试");
        }
        return data;
      });
    }).then(function(data){
      bugId.textContent = data.id;
      formCard.style.display = "none";
      successCard.classList.add("show");
      form.reset();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }).catch(function(err){
      showError(err.message || "网络异常，请稍后再试");
    }).finally(function(){
      btn.disabled = false;
      btn.textContent = "提交反馈";
    });
  });

  document.getElementById("againBtn").addEventListener("click", function(){
    successCard.classList.remove("show");
    formCard.style.display = "";
    clearError();
    document.getElementById("description").focus();
  });

  var STATUS = {
    fixed: { label: "已修复", cls: "fixed" },
    planned: { label: "计划修复中", cls: "planned" },
    wontfix: { label: "不予修复", cls: "wontfix" }
  };

  function fmtDate(ts){
    if (!ts) return "";
    var d = new Date(ts);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function loadHistory(){
    var list = document.getElementById("historyList");
    fetch("/api/bugs/history", { cache: "no-store" }).then(function(res){
      return res.json();
    }).then(function(data){
      if (!data.ok) throw new Error();
      var bugs = data.bugs || [];
      document.getElementById("historyCount").textContent = bugs.length ? "共 " + bugs.length + " 条" : "";
      if (!bugs.length){
        list.innerHTML = '<div class="empty">还没有已处理的反馈</div>';
        return;
      }
      list.innerHTML = bugs.map(function(b){
        var st = STATUS[b.status] || { label: b.status, cls: "wontfix" };
        var meta = [fmtDate(b.resolvedAt || b.createdAt)];
        if (b.side && b.side.length) meta.push(b.side.join(" / "));
        if (b.versions && b.versions.length) meta.push("v" + b.versions.join(" / v"));
        var desc = String(b.description || "");
        if (desc.length > 160) desc = desc.slice(0, 160) + "…";
        return '<article class="bug-item">' +
          '<div class="bug-title"><span>' + esc(b.title) + "</span>" +
          '<span class="badge ' + st.cls + '">' + st.label + "</span></div>" +
          '<div class="bug-meta">' + esc(meta.filter(Boolean).join(" · ")) + "</div>" +
          '<p class="bug-desc">' + esc(desc) + "</p></article>";
      }).join("");
    }).catch(function(){
      list.innerHTML = '<div class="empty">历史反馈加载失败</div>';
    });
  }

  loadHistory();
})();
</script>
</body>
</html>
